[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sleuth-secrets"
version = "1.0.0"
description = "High-performance Python-native secrets & API key scanner with entropy analysis and SARIF support"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Sleuth Contributors"}
]
keywords = ["security", "secrets", "scanner", "gitleaks", "api-key", "entropy", "sarif", "devops", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "PyYAML>=6.0.1",
]

[project.scripts]
sleuth = "sleuth.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/sleuth"
Repository = "https://github.com/yourusername/sleuth"
Issues = "https://github.com/yourusername/sleuth/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sleuth*"]
